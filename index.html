<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Rooftop Escape</title>
    <meta name="description" content="Endless 2D runner with dynamic physics-based web-swinging, rooftop obstacles, villain pursuit, and high score tracking." />
    <meta name="theme-color" content="#080612" />
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>
    
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
      body, html { width: 100%; height: 100%; overflow: hidden; background: #080612; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
      #game-wrapper { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #080612; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; background: linear-gradient(135deg, #0f0c1b 0%, #05030a 100%); }
      
      /* UI Overlays & HUD */
      .hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; box-sizing: border-box; z-index: 10; }
      .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
      .hud-group { display: flex; gap: 12px; align-items: center; pointer-events: auto; }
      .hud-badge { background: rgba(15, 12, 27, 0.85); border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: bold; color: #00f3ff; text-shadow: 0 0 8px rgba(0,243,255,0.5); backdrop-filter: blur(4px); }
      .hud-btn { background: rgba(15, 12, 27, 0.85); border: 1px solid rgba(255, 0, 85, 0.5); color: #ff0055; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; pointer-events: auto; box-shadow: 0 0 10px rgba(255,0,85,0.3); transition: transform 0.1s; }
      .hud-btn:active { transform: scale(0.92); }

      /* Modals & Screens */
      .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 3, 10, 0.88); backdrop-filter: blur(8px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; padding: 20px; text-align: center; }
      .screen-overlay.hidden { display: none !important; }
      h1 { font-size: 2.5rem; color: #00f3ff; text-shadow: 0 0 15px rgba(0,243,255,0.6); margin-bottom: 8px; font-weight: 900; letter-spacing: 1px; }
      p.subtitle { color: #b8b2cb; font-size: 1rem; margin-bottom: 24px; max-width: 400px; line-height: 1.4; }
      
      .btn-primary { background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%); color: #05030a; border: none; padding: 14px 36px; font-size: 18px; font-weight: 800; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(0,243,255,0.4); transition: transform 0.1s, box-shadow 0.2s; margin: 8px; }
      .btn-primary:active { transform: scale(0.95); }
      .btn-secondary { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 12px 28px; font-size: 16px; font-weight: 600; border-radius: 30px; cursor: pointer; margin: 8px; backdrop-filter: blur(4px); }

      /* Shop Modal Grid */
      .shop-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 440px; background: rgba(12, 9, 22, 0.95); border: 1px solid rgba(0,243,255,0.3); border-radius: 16px; padding: 20px; z-index: 100; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
      .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; max-height: 250px; overflow-y: auto; padding-right: 4px; }
      .shop-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.2s; }
      .shop-item.owned { border-color: rgba(0,243,255,0.4); }
      .shop-item.selected { border-color: #00f3ff; background: rgba(0,243,255,0.1); box-shadow: 0 0 10px rgba(0,243,255,0.2); }
      
      /* Danger Vignette */
      #danger-vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-shadow: inset 0 0 80px rgba(255,0,85,0); transition: box-shadow 0.3s; z-index: 5; }
      #danger-vignette.active { box-shadow: inset 0 0 100px rgba(255, 0, 85, 0.65); }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="gameCanvas"></canvas>
      <div id="danger-vignette"></div>

      <!-- HUD Layer -->
      <div class="hud-layer" id="hudLayer" style="display: none;">
        <div class="hud-top">
          <div class="hud-group">
            <div class="hud-badge" id="hudDistance">0m</div>
            <div class="hud-badge" id="hudCoins">🪙 0</div>
          </div>
          <div class="hud-group">
            <button class="hud-btn" id="btnMute" onclick="toggleAudio()">🔊</button>
            <button class="hud-btn" id="btnPause" onclick="togglePause()">⏸</button>
          </div>
        </div>
        <div class="hud-bottom" style="display:flex; justify-content:space-between; align-items:flex-end;">
          <div class="hud-badge" id="hudZone">Neon Core</div>
          <div class="hud-badge" id="hudThreat" style="border-color: #ff0055; color: #ff0055;">Threat: Safe</div>
        </div>
      </div>

      <!-- Start Screen -->
      <div class="screen-overlay" id="startScreen">
        <h1>Rooftop Escape</h1>
        <p class="subtitle">Physics web-swinging runner. Outrun the nemesis across cyber skylines!</p>
        <button class="btn-primary" onclick="startGame()">START RUN</button>
        <button class="btn-secondary" onclick="openShop()">CYBER ARMORY 🛍️</button>
      </div>

      <!-- Pause Screen -->
      <div class="screen-overlay hidden" id="pauseScreen">
        <h1>PAUSED</h1>
        <button class="btn-primary" onclick="togglePause()">RESUME</button>
        <button class="btn-secondary" onclick="openShop()">CYBER ARMORY 🛍️</button>
        <button class="btn-secondary" onclick="returnToMenu()">MAIN MENU</button>
      </div>

      <!-- Game Over Screen -->
      <div class="screen-overlay hidden" id="gameOverScreen">
        <h1>CAUGHT!</h1>
        <p class="subtitle" id="finalStats">Distance: 0m | Coins: 0</p>
        <button class="btn-primary" id="btnRevive" onclick="triggerRewardedAd('revive')">REVIVE ONCE (AD)</button>
        <button class="btn-primary" onclick="triggerRewardedAd('doubleCoins')">DOUBLE COINS (AD)</button>
        <button class="btn-secondary" onclick="startGame()">TRY AGAIN</button>
        <button class="btn-secondary" onclick="returnToMenu()">MAIN MENU</button>
      </div>

      <!-- Shop Modal -->
      <div class="shop-modal hidden" id="shopModal">
        <h2 style="color:#00f3ff; margin-bottom:10px; font-size:1.4rem;">Cyber Armory</h2>
        <p style="font-size:13px; color:#b8b2cb; margin-bottom:10px;">Bank Balance: <span id="shopBankCoins" style="color:#ffd700; font-weight:bold;">0</span> 🪙</p>
        <div style="font-size:12px; color:#00f3ff; margin-bottom:4px; font-weight:bold;">HERO SUITS</div>
        <div class="shop-grid" id="suitShopGrid"></div>
        <div style="font-size:12px; color:#00f3ff; margin-top:10px; margin-bottom:4px; font-weight:bold;">WEB ROPES</div>
        <div class="shop-grid" id="ropeShopGrid"></div>
        <button class="btn-primary" style="width:100%; margin-top:15px; padding:10px;" onclick="closeShop()">CLOSE SHOP</button>
      </div>
    </div>

    <!-- Complete Self-Contained JavaScript Engine -->
    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      
      let width = window.innerWidth;
      let height = window.innerHeight;
      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }
      window.addEventListener('resize', resize);
      resize();

      // Audio Engine (Web Audio API)
      let audioCtx = null;
      let isMuted = localStorage.getItem('rooftop_mute') === 'true';
      document.getElementById('btnMute').innerText = isMuted ? '🔇' : '🔊';

      function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playSound(type) {
        if (isMuted || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          const now = audioCtx.currentTime;

          if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
          } else if (type === 'swing') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(250, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          } else if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(987.77, now); // B5
            osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
          } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
          }
        } catch(e) {}
      }

      function toggleAudio() {
        isMuted = !isMuted;
        localStorage.setItem('rooftop_mute', isMuted);
        document.getElementById('btnMute').innerText = isMuted ? '🔇' : '🔊';
      }

      // Shop Catalog & Persistent Storage
      let bankCoins = parseInt(localStorage.getItem('rooftop_bankCoins') || '0');
      let highDistance = parseInt(localStorage.getItem('rooftop_highDistance') || '0');
      let ownedSuits = JSON.parse(localStorage.getItem('rooftop_suits') || '["classic"]');
      let currentSuit = localStorage.getItem('rooftop_activeSuit') || 'classic';
      let ownedRopes = JSON.parse(localStorage.getItem('rooftop_ropes') || '["electric"]');
      let currentRope = localStorage.getItem('rooftop_activeRope') || 'electric';

      const suitsDef = [
        { id: 'classic', name: 'Classic Crimson', price: 0, color: '#ff0055' },
        { id: 'cyber', name: 'Cyber Neon', price: 150, color: '#00f3ff' },
        { id: 'gold', name: 'Golden Champion', price: 350, color: '#ffd700' },
        { id: 'shadow', name: 'Shadow Ops', price: 600, color: '#9900ff' }
      ];

      const ropesDef = [
        { id: 'electric', name: 'Electric Web', price: 0, color: '#00f3ff' },
        { id: 'laser', name: 'Laser Beam', price: 120, color: '#ff0055' },
        { id: 'solar', name: 'Solar Thread', price: 300, color: '#ffd700' },
        { id: 'plasma', name: 'Plasma Violet', price: 450, color: '#aa00ff' }
      ];

      function openShop() {
        initAudio();
        document.getElementById('shopBankCoins').innerText = bankCoins;
        
        let suitHtml = '';
        suitsDef.forEach(s => {
          let owned = ownedSuits.includes(s.id);
          let active = currentSuit === s.id;
          suitHtml += `<div class="shop-item ${active ? 'selected' : (owned ? 'owned' : '')}" onclick="buyOrSelectSuit('${s.id}', ${s.price})">
            <div style="font-weight:bold; color:${s.color}; font-size:13px;">${s.name}</div>
            <div style="font-size:11px; color:#b8b2cb; margin-top:4px;">${active ? 'EQUIPPED' : (owned ? 'OWNED' : '🪙 ' + s.price)}</div>
          </div>`;
        });
        document.getElementById('suitShopGrid').innerHTML = suitHtml;

        let ropeHtml = '';
        ropesDef.forEach(r => {
          let owned = ownedRopes.includes(r.id);
          let active = currentRope === r.id;
          ropeHtml += `<div class="shop-item ${active ? 'selected' : (owned ? 'owned' : '')}" onclick="buyOrSelectRope('${r.id}', ${r.price})">
            <div style="font-weight:bold; color:${r.color}; font-size:13px;">${r.name}</div>
            <div style="font-size:11px; color:#b8b2cb; margin-top:4px;">${active ? 'EQUIPPED' : (owned ? 'OWNED' : '🪙 ' + r.price)}</div>
          </div>`;
        });
        document.getElementById('ropeShopGrid').innerHTML = ropeHtml;

        document.getElementById('shopModal').classList.remove('hidden');
      }

      function closeShop() {
        document.getElementById('shopModal').classList.add('hidden');
      }

      function buyOrSelectSuit(id, price) {
        if (ownedSuits.includes(id)) {
          currentSuit = id;
          localStorage.setItem('rooftop_activeSuit', id);
        } else if (bankCoins >= price) {
          bankCoins -= price;
          localStorage.setItem('rooftop_bankCoins', bankCoins);
          ownedSuits.push(id);
          localStorage.setItem('rooftop_suits', JSON.stringify(ownedSuits));
          currentSuit = id;
          localStorage.setItem('rooftop_activeSuit', id);
          playSound('coin');
        }
        openShop();
      }

      function buyOrSelectRope(id, price) {
        if (ownedRopes.includes(id)) {
          currentRope = id;
          localStorage.setItem('rooftop_activeRope', id);
        } else if (bankCoins >= price) {
          bankCoins -= price;
          localStorage.setItem('rooftop_bankCoins', bankCoins);
          ownedRopes.push(id);
          localStorage.setItem('rooftop_ropes', JSON.stringify(ownedRopes));
          currentRope = id;
          localStorage.setItem('rooftop_activeRope', id);
          playSound('coin');
        }
        openShop();
      }

      // Game State Variables
      let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER
      let distance = 0;
      let runCoins = 0;
      let score = 0;
      let strikeCount = 0;
      let invincibilityTimer = 0;
      
      let player = {
        x: 150, y: 300, vx: 0, vy: 0, radius: 18,
        isGrounded: false, isSwinging: false, ropeAnchor: null, ropeLength: 0
      };

      let roofs = [];
      let coins = [];
      let nemesis = { x: -100, speed: 3.5, strikeCooldown: 0 };
      let currentZone = { name: 'Neon Core', color: '#00f3ff', bg: '#080612', speed: 5 };

      function getSuitColor() {
        let s = suitsDef.find(x => x.id === currentSuit);
        return s ? s.color : '#ff0055';
      }

      function getRopeColor() {
        let r = ropesDef.find(x => x.id === currentRope);
        return r ? r.color : '#00f3ff';
      }

      function startGame() {
        initAudio();
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('pauseScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('hudLayer').style.display = 'flex';
        
        distance = 0;
        runCoins = 0;
        score = 0;
        strikeCount = 0;
        invincibilityTimer = 0;
        
        player.x = 150;
        player.y = 200;
        player.vx = 5;
        player.vy = 0;
        player.isSwinging = false;
        player.ropeAnchor = null;
        
        nemesis.x = -150;
        nemesis.speed = 4.2;

        roofs = [];
        coins = [];
        
        // Generate initial platforms
        let cursorX = 0;
        for (let i = 0; i < 6; i++) {
          let w = 300 + Math.random() * 200;
          let h = 250 + Math.random() * 100;
          roofs.push({ x: cursorX, y: height - h, w: w, h: h });
          
          if (i > 0 && Math.random() > 0.3) {
            coins.push({ x: cursorX + 50 + Math.random() * (w - 100), y: height - h - 60, collected: false });
          }
          cursorX += w + (80 + Math.random() * 70);
        }

        gameState = 'PLAYING';
      }

      function togglePause() {
        if (gameState === 'PLAYING') {
          gameState = 'PAUSED';
          document.getElementById('pauseScreen').classList.remove('hidden');
        } else if (gameState === 'PAUSED') {
          document.getElementById('pauseScreen').classList.add('hidden');
          gameState = 'PLAYING';
        }
      }

      function returnToMenu() {
        gameState = 'START';
        document.getElementById('hudLayer').style.display = 'none';
        document.getElementById('pauseScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('startScreen').classList.remove('hidden');
      }

      // Input Controls
      window.addEventListener('pointerdown', (e) => {
        if (gameState !== 'PLAYING') return;
        initAudio();
        
        // Find closest roof anchor ahead for swinging
        let bestRoof = null;
        let minDist = Infinity;
        roofs.forEach(r => {
          if (r.x > player.x && r.x < player.x + 400) {
            let d = Math.abs(r.x - player.x);
            if (d < minDist) {
              minDist = d;
              bestRoof = r;
            }
          }
        });

        if (bestRoof) {
          player.isSwinging = true;
          player.ropeAnchor = { x: bestRoof.x + 40, y: bestRoof.y - 40 };
          let dx = player.ropeAnchor.x - player.x;
          let dy = player.ropeAnchor.y - player.y;
          player.ropeLength = Math.hypot(dx, dy);
          playSound('swing');
        } else if (player.isGrounded) {
          player.vy = -12;
          player.isGrounded = false;
          playSound('jump');
        }
      });

      window.addEventListener('pointerup', () => {
        if (player.isSwinging) {
          player.isSwinging = false;
          player.vy -= 4; // Boost on release
        }
      });

      // Ad SDK Placeholders (CrazyGames & GameDistribution support)
      function triggerRewardedAd(type) {
        initAudio();
        // Portal SDK Integration check
        if (window.CrazyGames && window.CrazyGames.SDK && window.CrazyGames.SDK.ad) {
          window.CrazyGames.SDK.ad.requestRewarded({
            reward: () => grantAdReward(type),
            error: () => simulatedAdFallback(type)
          });
        } else if (typeof gdsdk !== 'undefined' && gdsdk.showAd) {
          gdsdk.showAd(GDSDK_REWARDED).then(() => grantAdReward(type)).catch(() => simulatedAdFallback(type));
        } else {
          simulatedAdFallback(type);
        }
      }

      function simulatedAdFallback(type) {
        // Fallback simulation overlay for offline/standalone testing
        let adDiv = document.createElement('div');
        adDiv.style.cssText = "position:absolute; top:0; left:0; width:100%; height:100%; background:#000; z-index:999; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff;";
        adDiv.innerHTML = `<h2>Simulated Portal Ad</h2><p style="margin:10px 0;">Playing reward ad...</p><div id='adTimer' style="font-size:2rem; color:#00f3ff; font-weight:bold;">3</div>`;
        document.body.appendChild(adDiv);
        
        let t = 3;
        let timerInterval = setInterval(() => {
          t--;
          if (document.getElementById('adTimer')) document.getElementById('adTimer').innerText = t;
          if (t <= 0) {
            clearInterval(timerInterval);
            document.body.removeChild(adDiv);
            grantAdReward(type);
          }
        }, 1000);
      }

      function grantAdReward(type) {
        if (type === 'revive') {
          strikeCount = 1;
          invincibilityTimer = 120;
          nemesis.x = player.x - 220;
          document.getElementById('gameOverScreen').classList.add('hidden');
          gameState = 'PLAYING';
        } else if (type === 'doubleCoins') {
          runCoins *= 2;
          bankCoins += runCoins;
          localStorage.setItem('rooftop_bankCoins', bankCoins);
          document.getElementById('gameOverScreen').classList.add('hidden');
          returnToMenu();
        }
      }

      // Main Game Loop Update & Render
      function update() {
        if (gameState !== 'PLAYING') return;

        // Zone Progression Scaling
        if (distance >= 800) {
          currentZone = { name: 'Orbital Spires', color: '#ffd700', bg: '#120c04', speed: 7.2 };
        } else if (distance >= 350) {
          currentZone = { name: 'Cyber Slums', color: '#00f3ff', bg: '#070f1a', speed: 6.2 };
        } else {
          currentZone = { name: 'Neon Core', color: '#00f3ff', bg: '#080612', speed: 5.2 };
        }

        // Physics & Movement
        player.vx = currentZone.speed;
        distance += player.vx * 0.05;
        score = Math.floor(distance) + (runCoins * 15);

        if (player.isSwinging && player.ropeAnchor) {
          let dx = player.x - player.ropeAnchor.x;
          let dy = player.y - player.ropeAnchor.y;
          let angle = Math.atan2(dy, dx);
          let currentDist = Math.hypot(dx, dy);
          
          // Pendulum constraint pull
          player.x = player.ropeAnchor.x + Math.cos(angle) * player.ropeLength;
          player.y = player.ropeAnchor.y + Math.sin(angle) * player.ropeLength;
          player.vx *= 1.01;
        } else {
          player.vy += 0.5; // Gravity
          player.x += player.vx;
          player.y += player.vy;
        }

        // Roof Collision Detection
        player.isGrounded = false;
        roofs.forEach(r => {
          if (player.x >= r.x && player.x <= r.x + r.w) {
            if (player.y + player.radius >= r.y && player.y - player.radius <= r.y + 20 && player.vy >= 0) {
              player.y = r.y - player.radius;
              player.vy = 0;
              player.isGrounded = true;
              player.isSwinging = false;
            }
          }
        });

        // Fall into pit check
        if (player.y > height + 50) {
          handleDeath();
        }

        // Procedural Roof Generator
        let lastRoof = roofs[roofs.length - 1];
        if (lastRoof.x + lastRoof.w < player.x + width * 1.5) {
          let gap = 90 + Math.random() * (distance > 350 ? 90 : 50);
          let w = 250 + Math.random() * 250;
          let h = 200 + Math.random() * 150;
          let newX = lastRoof.x + lastRoof.w + gap;
          roofs.push({ x: newX, y: height - h, w: w, h: h });

          if (Math.random() > 0.2) {
            coins.push({ x: newX + 40 + Math.random() * (w - 80), y: height - h - 50, collected: false });
          }
        }

        // Clean offscreen items
        roofs = roofs.filter(r => r.x + r.w > player.x - 300);
        coins = coins.filter(c => c.x > player.x - 300 && !c.collected);

        // Coin Collection
        coins.forEach(c => {
          let dist = Math.hypot(player.x - c.x, player.y - c.y);
          if (dist < player.radius + 15) {
            c.collected = true;
            runCoins++;
            playSound('coin');
          }
        });

        // Nemesis AI Pursuit
        nemesis.x += (player.x - 180 - nemesis.x) * 0.05;
        if (player.x - nemesis.x < 110) {
          if (invincibilityTimer <= 0) {
            strikeCount++;
            invincibilityTimer = 90; // 1.5s invincibility frames
            playSound('hit');
            nemesis.x -= 80;
            if (strikeCount >= 3) {
              handleDeath();
            }
          }
        }

        if (invincibilityTimer > 0) invincibilityTimer--;

        // HUD Updates
        document.getElementById('hudDistance').innerText = Math.floor(distance) + 'm';
        document.getElementById('hudCoins').innerText = '🪙 ' + runCoins;
        document.getElementById('hudZone').innerText = currentZone.name;
        
        let threatEl = document.getElementById('hudThreat');
        let vignette = document.getElementById('danger-vignette');
        let gapToNemesis = player.x - nemesis.x;
        if (gapToNemesis < 180) {
          threatEl.innerText = 'Threat: CRITICAL ⚠️';
          vignette.classList.add('active');
        } else if (gapToNemesis < 280) {
          threatEl.innerText = 'Threat: WARNING ⚡';
          vignette.classList.add('active');
        } else {
          threatEl.innerText = 'Threat: Safe';
          vignette.classList.remove('active');
        }
      }

      function handleDeath() {
        gameState = 'GAMEOVER';
        bankCoins += runCoins;
        localStorage.setItem('rooftop_bankCoins', bankCoins);
        if (distance > highDistance) {
          highDistance = Math.floor(distance);
          localStorage.setItem('rooftop_highDistance', highDistance);
        }
        document.getElementById('hudLayer').style.display = 'none';
        document.getElementById('finalStats').innerText = `Distance: ${Math.floor(distance)}m | Coins: ${runCoins}`;
        document.getElementById('gameOverScreen').classList.remove('hidden');
      }

      function render() {
        ctx.fillStyle = currentZone.bg;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(-player.x + width * 0.3, 0);

        // Render Roofs
        roofs.forEach(r => {
          ctx.fillStyle = '#151026';
          ctx.fillRect(r.x, r.y, r.w, r.h);
          ctx.strokeStyle = currentZone.color;
          ctx.lineWidth = 2;
          ctx.strokeRect(r.x, r.y, r.w, r.h);
        });

        // Render Coins
        coins.forEach(c => {
          if (!c.collected) {
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(c.x, c.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        });

        // Render Web Rope
        if (player.isSwinging && player.ropeAnchor) {
          ctx.strokeStyle = getRopeColor();
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(player.x, player.y);
          ctx.lineTo(player.ropeAnchor.x, player.ropeAnchor.y);
          ctx.stroke();
        }

        // Render Player
        ctx.fillStyle = invincibilityTimer > 0 && Math.floor(Date.now() / 50) % 2 === 0 ? '#fff' : getSuitColor();
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Render Nemesis
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.arc(nemesis.x, player.y, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
      }

      function loop() {
        update();
        render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
